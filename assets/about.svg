<rect width="1000" height="190" rx="14" fill="#161b22" stroke="#30363d"/><text x="30" y="50" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" fill="#c9d1d9">Everest Çelik Kapı'da dış ticaret süreçlerini yönetiyorum.</text><text x="30" y="82" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" fill="#c9d1d9">Müşteri bulma, tersine mühendislik, 3D modelleme ve ofis</text><text x="30" y="114" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" fill="#c9d1d9">otomasyonu için yapay zekâ destekli araçlar geliştiriyorum.</text><text x="30" y="146" font-family="'Segoe UI',Ubuntu,Arial,sans-serif" font-size="19" fill="#c9d1d9">Amaç: tekrar eden işi yazılıma, yazılımı da satışa çevirmek.</text></svg>